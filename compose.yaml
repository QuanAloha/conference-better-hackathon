services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-conference}:${POSTGRES_PASSWORD:-conference_dev_password}@postgres:5432/${POSTGRES_DB:-conference}
      WHISPERLIVE_URL: http://whisperlive:9090
      LIBRETRANSLATE_URL: http://libretranslate:5000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      whisperlive:
        condition: service_started
      libretranslate:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conference}
      POSTGRES_USER: ${POSTGRES_USER:-conference}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conference_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conference} -d ${POSTGRES_DB:-conference}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  whisperlive:
    # Upstream publishes this CPU image for AMD64; Docker Desktop emulates it on ARM Macs.
    image: ghcr.io/collabora/whisperlive-cpu:latest
    platform: linux/amd64
    ports:
      - "${WHISPERLIVE_PORT:-9090}:9090"
    volumes:
      - whisperlive_cache:/root/.cache/whisper-live
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate:latest
    ports:
      - "${LIBRETRANSLATE_PORT:-5001}:5000"
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  whisperlive_cache:
  libretranslate_models:
