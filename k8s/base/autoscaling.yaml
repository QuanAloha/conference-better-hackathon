apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: conference-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: conference-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: conference-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: conference-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
